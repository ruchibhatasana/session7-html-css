
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Fest Schedule</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        article {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .schedule {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
        }

        .slot {
            flex: 1;
            padding: 20px;
            background-color: white;
            border: 2px solid #6c63ff;
            border-radius: 10px;
            text-align: center;
        }

        .slot:first-child {
            flex: 2;
            background-color: #e8e6ff;
        }

        .time {
            font-weight: bold;
            color: #6c63ff;
        }

        @media (max-width: 600px) {
            .schedule {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

    <article>
        <h1>Day 1 Schedule</h1>

        <div class="schedule">

            <div class="slot">
                <p class="time">10:00 AM</p>
                <h3>Inauguration Ceremony</h3>
                <p>Welcome speech and lamp lighting to begin the college fest.</p>
            </div>

            <div class="slot">
                <p class="time">11:00 AM</p>
                <h3>Music</h3>
            </div>

            <div class="slot">
                <p class="time">12:00 PM</p>
                <h3>Lunch Break</h3>
                <p>Enjoy lunch with friends.</p>
            </div>

            <div class="slot">
                <p class="time">2:00 PM</p>
                <h3>Games and Activities</h3>
                <p>Participate in fun competitions and team challenges.</p>
            </div>

        </div>
    </article>

</body>
</html>
